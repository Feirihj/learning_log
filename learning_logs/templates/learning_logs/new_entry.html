{% extends "learning_logs/base.html" %}

{% block page_header %}
  <h1>Новая запись</h1>
  <p class="text-muted mb-0">Тема: <a href="{% url 'learning_logs:topic' topic.id %}">{{ topic.text }}</a></p>
{% endblock page_header %}

{% block content %}
  <form method="post" action="{% url 'learning_logs:new_entry' topic.id %}">
    {% csrf_token %}
    {% include "learning_logs/_form.html" %}
    <button type="submit" class="btn btn-primary">Добавить запись</button>
    <a class="btn btn-outline-secondary" href="{% url 'learning_logs:topic' topic.id %}">Отмена</a>
  </form>
{% endblock content %}
