{% extends "learning_logs/base.html" %}

{% block page_header %}
  <h1>Темы</h1>
{% endblock page_header %}

{% block content %}
  <ul class="list-group mb-4">
    {% for topic in topics %}
      <li class="list-group-item">
        <a href="{% url 'learning_logs:topic' topic.id %}">{{ topic.text }}</a>
      </li>
    {% empty %}
      <li class="list-group-item">Пока нет ни одной темы.</li>
    {% endfor %}
  </ul>
  <a class="btn btn-primary" href="{% url 'learning_logs:new_topic' %}">Добавить новую тему</a>
{% endblock content %}
