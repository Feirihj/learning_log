{% extends "learning_logs/base.html" %}

{% block page_header %}
  <h1>Регистрация</h1>
{% endblock page_header %}

{% block content %}
  <form method="post" action="{% url 'accounts:register' %}" style="max-width: 420px;">
    {% csrf_token %}
    {% include "learning_logs/_form.html" %}
    <button type="submit" class="btn btn-primary">Зарегистрироваться</button>
  </form>
  <p class="mt-3">Уже есть аккаунт? <a href="{% url 'accounts:login' %}">Войдите</a>.</p>
{% endblock content %}
