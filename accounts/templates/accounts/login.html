{% extends "learning_logs/base.html" %}

{% block page_header %}
  <h1>Вход</h1>
{% endblock page_header %}

{% block content %}
  <form method="post" action="{% url 'accounts:login' %}" style="max-width: 420px;">
    {% csrf_token %}
    {% include "learning_logs/_form.html" %}
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit" class="btn btn-primary">Войти</button>
  </form>
  <p class="mt-3">Нет аккаунта? <a href="{% url 'accounts:register' %}">Зарегистрируйтесь</a>.</p>
{% endblock content %}
